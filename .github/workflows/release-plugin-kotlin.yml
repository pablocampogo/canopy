name: Release Kotlin Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version for the plugin release (e.g. 1.0.0). The 'plugin-kotlin-v' prefix is added automatically."
        required: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}

    steps:
      - name: Validate version and compute tag
        id: compute
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$VERSION" =~ $SEMVER_REGEX ]]; then
            echo "::error::Version '$VERSION' is not a valid semantic version. Expected MAJOR.MINOR.PATCH (e.g. 1.0.0)"
            exit 1
          fi
          echo "tag=plugin-kotlin-v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version '$VERSION' is valid. Release tag: plugin-kotlin-v${VERSION}"

  release:
    name: Build and Release Kotlin Plugin
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build fat JAR
        working-directory: plugin/kotlin
        run: ./gradlew fatJar --no-daemon

      - name: Prepare release artifacts
        working-directory: plugin/kotlin
        run: |
          mkdir -p release
          cp build/libs/canopy-plugin-kotlin-*-all.jar release/kotlin-plugin.jar
          cd release && tar -czf kotlin-plugin.tar.gz kotlin-plugin.jar

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: "Kotlin Plugin ${{ needs.validate.outputs.tag }}"
          body: |
            Kotlin Plugin Release ${{ needs.validate.outputs.tag }}
            
            ## Requirements
            - Java Runtime Environment (JRE) 21 or later
            
            ## Installation
            1. Download `kotlin-plugin.tar.gz` to `plugin/kotlin/`
            2. The plugin will auto-extract on first start
            
            ## Assets
            - `kotlin-plugin.tar.gz` - Fat JAR with all dependencies included
          files: |
            plugin/kotlin/release/kotlin-plugin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
